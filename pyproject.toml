[tool.uv.workspace]
members = ["packages/core", "packages/providers/*", "packages/cli", "packages/server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits a real provider (skipped by default)",
    "pg: needs a Postgres at DATABASE_URL (skipped when unset)",
    "integration: needs the full compose stack up (skipped when unset)",
    "solver: needs a Cloudflare solver at COWBIRD_SOLVER_URL (skipped when unset)",
]
# Every provider package has tests/test_contract.py and tests/test_live.py.
# Under the default import mode those identical basenames collide across
# packages; importlib mode keys modules by full path instead, so adding a
# provider never breaks collection.
addopts = "--import-mode=importlib -m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
