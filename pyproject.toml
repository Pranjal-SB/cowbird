[tool.uv.workspace]
members = ["packages/core", "packages/providers/*", "packages/cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits a real provider (skipped by default)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
