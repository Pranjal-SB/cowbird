# The servers and the proxy arrive later. Postgres alone is what the store and
# health tests need, and it is useful on its own for local work.
services:
  postgres:
    image: postgres:17
    # Literal password is deliberate: a local throwaway container credential.
    # Nothing in a deploy reads this file.
    environment:
      POSTGRES_USER: cowbird
      POSTGRES_PASSWORD: cowbird
      POSTGRES_DB: cowbird
    ports:
      - "5432:5432"
    healthcheck:
      # pg_isready returns before the server accepts connections on first boot,
      # so dependents that wait on this still need to tolerate one refusal.
      test: ["CMD-SHELL", "pg_isready -U cowbird -d cowbird"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Optional Cloudflare solver (MIT, github.com/B00H0O/cloudflare-solver),
  # pinned to a commit. Loopback only: it drives a browser to any URL it is
  # handed, so exposing it is an open SSRF. Tokens and cookies it earns are
  # bound to this host's IP, which the servers share.
  solver:
    build: https://github.com/B00H0O/cloudflare-solver.git#ce75d714925eef17f913ad6b4c16252bec090739
    ports:
      - "127.0.0.1:407:407"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:407/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  server-1: &server
    build: .
    # WEBHOOK_ALLOW_PRIVATE is on for both servers here and must not be in a
    # deploy: it disables the SSRF guard that stops a caller pointing a webhook
    # at a private address. Local callbacks are the point of this stack -- the
    # only reachable targets are containers on a private compose network.
    environment:
      API_KEYS: local-dev
      DATABASE_URL: postgresql://cowbird:cowbird@postgres:5432/cowbird
      INSTANCE_ID: backend-1
      HEALTH_FLUSH_SECONDS: "2"
      WEBHOOK_ALLOW_PRIVATE: "1"
      COWBIRD_SOLVER_URL: http://solver:407
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: a server must still boot with the solver down.
      solver:
        condition: service_started
    ports:
      - "8001:8000"

  server-2:
    <<: *server
    environment:
      API_KEYS: local-dev
      DATABASE_URL: postgresql://cowbird:cowbird@postgres:5432/cowbird
      INSTANCE_ID: backend-2
      HEALTH_FLUSH_SECONDS: "2"
      WEBHOOK_ALLOW_PRIVATE: "1"
      COWBIRD_SOLVER_URL: http://solver:407
    ports:
      - "8002:8000"

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server-1
      - server-2
    ports:
      - "8000:8000"
