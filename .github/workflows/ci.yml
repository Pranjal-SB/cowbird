name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly canary. The mocked suite proves this repo works; only the scheduled
  # run hits real providers, which is what catches them changing endpoints.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -m "not live" --cov --cov-report=term-missing

  canary:
    # Never on a PR: a third party being down is not a regression here, and a
    # push should not hammer them.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - id: canary
        run: uv run cowbird canary | tee canary.txt
        continue-on-error: true
      # A red canary is the point: it means a live backend's API changed
      # underneath us. But a datacenter runner IP can also draw a Cloudflare
      # challenge that a real user never sees, so "down" alone isn't wired to
      # fail here -- only "quarantined" (schema drift) does, inside the CLI.
      - name: File an issue for any quarantined provider
        if: steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Weekly schedule + a provider that stays quarantined for weeks
          # would otherwise file one duplicate issue per run. A human already
          # has the first one open; don't page them again for the same thing.
          if [ -z "$(gh issue list --label canary --state open --json number -q '.[0]')" ]; then
            gh issue create \
              --title "canary: provider quarantined $(date -u +%F)" \
              --body "$(cat canary.txt)" \
              --label canary
          fi
