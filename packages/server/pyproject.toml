[project]
name = "cowbird-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cowbird-core",
    "cowbird-mailtm",
    "cowbird-emailnator",
    "cowbird-inboxes",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[tool.uv.sources]
cowbird-core = { workspace = true }
cowbird-mailtm = { workspace = true }
cowbird-emailnator = { workspace = true }
cowbird-inboxes = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
