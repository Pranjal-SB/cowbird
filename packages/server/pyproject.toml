[project]
name = "cowbird-server"
version = "0.1.0"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "cowbird-core",
    "cowbird-mailtm",
    "cowbird-emailnator",
    "cowbird-inboxes",
    # slowapi reads FastAPI's route internals and has not shipped since 2023.
    # Upper bound stays until the rate-limit tests are re-run against a newer FastAPI.
    "fastapi>=0.115,<0.142",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "slowapi>=0.1.9",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[tool.uv.sources]
cowbird-core = { workspace = true }
cowbird-mailtm = { workspace = true }
cowbird-emailnator = { workspace = true }
cowbird-inboxes = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cowbird_server = ["migrations/*.sql"]
