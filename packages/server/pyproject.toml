[project]
name = "cowbird-server"
version = "0.1.0"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "cowbird-core",
    "cowbird-mailtm",
    "cowbird-emailnator",
    "cowbird-inboxes",
"cowbird-guerrillamail",
"cowbird-tenminutemail",
"cowbird-tempmailorg",
"cowbird-twentytwodo",
"cowbird-inboxkitten",
"cowbird-maildrop",
"cowbird-nicemail",
"cowbird-mailcx",
"cowbird-tempmailio",
"cowbird-temporarymail",
"cowbird-re146",
"cowbird-tempmailplus",
"cowbird-mailticking",
"cowbird-tempmailhub",
"cowbird-reusableemail",
"cowbird-disposablemail",
"cowbird-duckmail",
"cowbird-smailpro",
"cowbird-vanishinbox",
"cowbird-xeramail",
"cowbird-zenvex",
"cowbird-etempmail",
"cowbird-cftempmail",
    # slowapi reads FastAPI's route internals and has not shipped since 2023.
    # Upper bound stays until the rate-limit tests are re-run against a newer FastAPI.
    "fastapi>=0.115,<0.142",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "slowapi>=0.1.9",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[tool.uv.sources]
cowbird-core = { workspace = true }
cowbird-mailtm = { workspace = true }
cowbird-emailnator = { workspace = true }
cowbird-inboxes = { workspace = true }
cowbird-guerrillamail = { workspace = true }
cowbird-tenminutemail = { workspace = true }
cowbird-tempmailorg = { workspace = true }
cowbird-twentytwodo = { workspace = true }
cowbird-inboxkitten = { workspace = true }
cowbird-maildrop = { workspace = true }
cowbird-nicemail = { workspace = true }
cowbird-mailcx = { workspace = true }
cowbird-tempmailio = { workspace = true }
cowbird-temporarymail = { workspace = true }
cowbird-re146 = { workspace = true }
cowbird-tempmailplus = { workspace = true }
cowbird-mailticking = { workspace = true }
cowbird-tempmailhub = { workspace = true }
cowbird-reusableemail = { workspace = true }
cowbird-disposablemail = { workspace = true }
cowbird-duckmail = { workspace = true }
cowbird-smailpro = { workspace = true }
cowbird-vanishinbox = { workspace = true }
cowbird-xeramail = { workspace = true }
cowbird-zenvex = { workspace = true }
cowbird-etempmail = { workspace = true }
cowbird-cftempmail = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cowbird_server = ["migrations/*.sql"]
