[project]
name = "cowbird"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cowbird-core", "cowbird-mailtm"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6"]

[tool.uv.sources]
cowbird-core = { workspace = true }
cowbird-mailtm = { workspace = true }

[project.scripts]
cowbird = "cowbird_cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
