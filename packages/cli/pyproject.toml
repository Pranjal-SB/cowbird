[project]
name = "cowbird"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cowbird-core",
    "cowbird-mailtm",
    "cowbird-emailnator",
    "cowbird-inboxes",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "packaging"]

[tool.uv.sources]
cowbird-core = { workspace = true }
cowbird-mailtm = { workspace = true }
cowbird-emailnator = { workspace = true }
cowbird-inboxes = { workspace = true }

[project.scripts]
cowbird = "cowbird_cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
